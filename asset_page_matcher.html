<div style="max-width: 100%; font-family: var(--font-sans);">

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem;">

    <div style="border: 0.5px dashed var(--border-strong); border-radius: 12px; padding: 1.5rem 1rem; text-align: center;" id="dropZone1">
      <i class="ti ti-file-code" style="font-size: 24px; color: var(--text-muted);" aria-hidden="true"></i>
      <p style="font-size: 13px; color: var(--text-secondary); margin: 10px 0 12px;">1. Drop <code style="font-family: var(--font-mono); font-size: 12px;">config.js</code></p>
      <input type="file" id="fileInput1" accept=".js,.txt" style="display: none;" />
      <button id="chooseBtn1" type="button">Choose file</button>
      <span id="fileName1" style="display: block; font-size: 12px; color: var(--text-muted); margin-top: 8px;"></span>
    </div>

    <div style="border: 0.5px dashed var(--border-strong); border-radius: 12px; padding: 1.5rem 1rem; text-align: center;" id="dropZone2">
      <i class="ti ti-table" style="font-size: 24px; color: var(--text-muted);" aria-hidden="true"></i>
      <p style="font-size: 13px; color: var(--text-secondary); margin: 10px 0 12px;">2. Drop LMS <code style="font-family: var(--font-mono); font-size: 12px;">.csv</code></p>
      <input type="file" id="fileInput2" accept=".csv" style="display: none;" />
      <button id="chooseBtn2" type="button">Choose file</button>
      <span id="fileName2" style="display: block; font-size: 12px; color: var(--text-muted); margin-top: 8px;"></span>
    </div>

  </div>

  <div id="errorBox" style="display: none; font-size: 13px; color: var(--text-danger); background: var(--bg-danger); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 1rem;"></div>

  <div id="resultsWrap" style="display: none;">

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 1.25rem;">
      <div style="background: var(--surface-1); border-radius: var(--radius); padding: 1rem;">
        <p style="font-size: 13px; color: var(--text-secondary); margin: 0 0 4px;">Config assets</p>
        <p style="font-size: 24px; font-weight: 500; margin: 0;" id="statConfig">0</p>
      </div>
      <div style="background: var(--surface-1); border-radius: var(--radius); padding: 1rem;">
        <p style="font-size: 13px; color: var(--text-secondary); margin: 0 0 4px;">Matched</p>
        <p style="font-size: 24px; font-weight: 500; margin: 0; color: var(--text-success);" id="statMatched">0</p>
      </div>
      <div style="background: var(--surface-1); border-radius: var(--radius); padding: 1rem;">
        <p style="font-size: 13px; color: var(--text-secondary); margin: 0 0 4px;">Unmatched</p>
        <p style="font-size: 24px; font-weight: 500; margin: 0; color: var(--text-warning);" id="statUnmatched">0</p>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
      <input type="text" id="filterInput" placeholder="Filter by name or asset key" style="flex: 1;" />
      <button id="downloadBtn" type="button"><i class="ti ti-download" style="font-size: 15px; vertical-align: -2px; margin-right: 4px;" aria-hidden="true"></i>Download updated CSV</button>
    </div>

    <div style="overflow-x: auto; border: 0.5px solid var(--border); border-radius: var(--radius); max-height: 420px; overflow-y: auto;">
      <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
        <thead>
          <tr style="background: var(--surface-1); text-align: left; position: sticky; top: 0;">
            <th style="padding: 8px 10px; font-weight: 500; color: var(--text-secondary);">Name</th>
            <th style="padding: 8px 10px; font-weight: 500; color: var(--text-secondary);">Matched key</th>
            <th style="padding: 8px 10px; font-weight: 500; color: var(--text-secondary);">isVisibleInPageButton</th>
            <th style="padding: 8px 10px; font-weight: 500; color: var(--text-secondary);">pageNo</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </div>

</div>
<script>
(function(){
  var fileInput1 = document.getElementById('fileInput1');
  var chooseBtn1 = document.getElementById('chooseBtn1');
  var dropZone1 = document.getElementById('dropZone1');
  var fileName1 = document.getElementById('fileName1');

  var fileInput2 = document.getElementById('fileInput2');
  var chooseBtn2 = document.getElementById('chooseBtn2');
  var dropZone2 = document.getElementById('dropZone2');
  var fileName2 = document.getElementById('fileName2');

  var errorBox = document.getElementById('errorBox');
  var resultsWrap = document.getElementById('resultsWrap');
  var resultsBody = document.getElementById('resultsBody');
  var filterInput = document.getElementById('filterInput');
  var downloadBtn = document.getElementById('downloadBtn');

  var configText = null;
  var csvText = null;
  var csvRowsGlobal = null;
  var displayRows = [];
  var outputCsvString = '';

  function wireDropZone(zone, input, chooseBtn, onFile){
    chooseBtn.addEventListener('click', function(){ input.click(); });
    input.addEventListener('change', function(e){
      if (e.target.files && e.target.files[0]) onFile(e.target.files[0]);
    });
    zone.addEventListener('dragover', function(e){
      e.preventDefault();
      zone.style.borderColor = 'var(--border-accent)';
    });
    zone.addEventListener('dragleave', function(){ zone.style.borderColor = ''; });
    zone.addEventListener('drop', function(e){
      e.preventDefault();
      zone.style.borderColor = '';
      if (e.dataTransfer.files && e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]);
    });
  }

  wireDropZone(dropZone1, fileInput1, chooseBtn1, function(file){
    fileName1.textContent = file.name;
    var reader = new FileReader();
    reader.onload = function(evt){ configText = evt.target.result; tryProcess(); };
    reader.readAsText(file);
  });

  wireDropZone(dropZone2, fileInput2, chooseBtn2, function(file){
    fileName2.textContent = file.name;
    var reader = new FileReader();
    reader.onload = function(evt){ csvText = evt.target.result; tryProcess(); };
    reader.readAsText(file);
  });

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
    resultsWrap.style.display = 'none';
  }

  function parseCsv(text){
    var rows = [];
    var i = 0, field = '', row = [], inQuotes = false;
    var n = text.length;
    while (i < n){
      var c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      } else {
        if (c === '"'){ inQuotes = true; i++; continue; }
        if (c === ','){ row.push(field); field = ''; i++; continue; }
        if (c === '\r'){ i++; continue; }
        if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
        field += c; i++; continue;
      }
    }
    if (field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return !(r.length === 1 && r[0] === ''); });
  }

  function csvCell(v){
    v = v == null ? '' : String(v);
    return '"' + v.replace(/"/g, '""') + '"';
  }

  function extractConfigAssets(text){
    var m = text.match(/var\s+pageEditor\s*=\s*(\{[\s\S]*?\});\s*bookConfig\.isFlipPdf/);
    if (!m) throw new Error('No pageEditor object found in config.js');
    var data = JSON.parse(m[1]);
    var pageAnnos = data.pageAnnos;
    if (!pageAnnos || !pageAnnos.length) throw new Error('pageEditor.pageAnnos is empty or missing');

    var extracted = [];
    for (var i = 0; i < pageAnnos.length; i++){
      var annos = pageAnnos[i];
      var pageNum = i + 1;
      if (!annos || !annos.length) continue;
      for (var j = 0; j < annos.length; j++){
        var anno = annos[j];
        if (!anno || !anno.action) continue;
        var url = anno.action.windowURL;
        if (!url) continue;
        var ext = null;
        if (/\.mp4/i.test(url)) ext = 'MP4';
        else if (/\.mp3/i.test(url)) ext = 'MP3';
        else if (/\.html/i.test(url)) ext = 'HTML';
        if (!ext) continue;

        var chm = url.match(/_((?:RV|CH)\d+)[_\/]/);
        var chapter = chm ? chm[1] : 'FRONT';

        var assetKey;
        if (ext === 'HTML'){
          var fm = url.match(/\/([^\/]+)\/index\.html/i);
          assetKey = fm ? fm[1] : url.split('/').slice(-2, -1)[0];
        } else {
          var nm = url.match(/\/([^\/]+)\.(mp4|mp3)/i);
          assetKey = nm ? nm[1] : url.split('/').pop();
        }
        extracted.push({ page: pageNum, chapter: chapter, ext: ext, key: assetKey });
      }
    }
    if (!extracted.length) throw new Error('No MP4, MP3, or HTML assets found in pageEditor');

    var chapterOrder = [];
    var lastPage = {};
    for (var k = 0; k < extracted.length; k++){
      var ch = extracted[k].chapter;
      if (chapterOrder.indexOf(ch) === -1) chapterOrder.push(ch);
      lastPage[ch] = Math.max(lastPage[ch] || 0, extracted[k].page);
    }
    var chapterStart = {};
    var prevEnd = 0;
    for (var c = 0; c < chapterOrder.length; c++){
      var chc = chapterOrder[c];
      chapterStart[chc] = prevEnd + 1;
      prevEnd = lastPage[chc];
    }

    var assetPage = {};
    extracted.forEach(function(r){
      assetPage[r.key] = r.page - chapterStart[r.chapter] + 1;
    });
    return assetPage;
  }

  function baseKeyFromUrl(url){
    var clean = url.replace(/\\/g, '/');
    var parts = clean.split('/').filter(function(p){ return p.length > 0; });
    var last = parts[parts.length - 1] || '';
    if (/^index\.html?$/i.test(last) && parts.length > 1){
      return parts[parts.length - 2];
    }
    return last.replace(/\.[A-Za-z0-9]+$/, '');
  }

  function tryProcess(){
    if (!configText || !csvText) return;
    errorBox.style.display = 'none';
    try {
      var assetPage = extractConfigAssets(configText);
      var rows = parseCsv(csvText);
      var header = rows[0];
      var idx = {};
      header.forEach(function(h, i){ idx[h.trim()] = i; });

      var required = ['url', 'isVisibleInPageButton', 'pageNo', 'name', 'rowType'];
      for (var r = 0; r < required.length; r++){
        if (!(required[r] in idx)) throw new Error('CSV missing expected column: ' + required[r]);
      }

      var matchedCount = 0, unmatchedCount = 0;
      displayRows = [];

      for (var ri = 1; ri < rows.length; ri++){
        var row = rows[ri];
        if (!row || row.length < header.length - 2) continue;
        if (row[idx.rowType] !== 'chapter_assets') continue;
        var url = row[idx.url];
        if (!url) continue;
        var key = baseKeyFromUrl(url);
        if (key in assetPage){
          var page = assetPage[key];
          row[idx.isVisibleInPageButton] = 'TRUE';
          row[idx.pageNo] = String(page);
          matchedCount++;
          displayRows.push({ name: row[idx.name], key: key, btn: 'TRUE', page: page });
        } else {
          unmatchedCount++;
        }
      }

      document.getElementById('statConfig').textContent = Object.keys(assetPage).length;
      document.getElementById('statMatched').textContent = matchedCount;
      document.getElementById('statUnmatched').textContent = unmatchedCount;

      var lines = rows.map(function(row){
        return row.map(csvCell).join(',');
      });
      outputCsvString = lines.join('\r\n');

      drawTable(displayRows);
      resultsWrap.style.display = 'block';
    } catch (err) {
      showError(err.message);
    }
  }

  function drawTable(items){
    resultsBody.innerHTML = '';
    items.forEach(function(r){
      var tr = document.createElement('tr');
      tr.style.borderTop = '0.5px solid var(--border)';
      tr.innerHTML =
        '<td style="padding: 7px 10px;">' + r.name + '</td>' +
        '<td style="padding: 7px 10px; font-family: var(--font-mono); font-size: 12px;">' + r.key + '</td>' +
        '<td style="padding: 7px 10px;"><span class="c-teal" style="display: inline-block; padding: 2px 8px; border-radius: var(--radius); font-size: 12px; font-weight: 500;">TRUE</span></td>' +
        '<td style="padding: 7px 10px;">' + r.page + '</td>';
      resultsBody.appendChild(tr);
    });
  }

  filterInput.addEventListener('input', function(){
    var q = filterInput.value.trim().toLowerCase();
    if (!q){ drawTable(displayRows); return; }
    var filtered = displayRows.filter(function(r){
      return r.name.toLowerCase().indexOf(q) !== -1 || r.key.toLowerCase().indexOf(q) !== -1;
    });
    drawTable(filtered);
  });

  downloadBtn.addEventListener('click', function(){
    if (!outputCsvString) return;
    var blob = new Blob([outputCsvString], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'chapters_matched.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
})();
</script>
